# libs.versions.toml

[versions]
activityKtx = "1.9.0"
agp = "8.13.0" # Версія Android Gradle Plugin
drawerlayout = "1.2.0"
kotlin = "1.9.23" # Версія Kotlin
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.9.1" # Залишаємо, оскільки Lifecycle часто використовується і з Views
appcompat = "1.6.1"
material = "1.10.0" # Для com.google.android.material:material
activity = "1.10.1"
constraintlayout = "2.2.1"
gson = "2.10.1" # Для Gson
materialVersion = "1.12.0"
roomCompiler = "2.5.0"
roomVersion = "2.6.1"
voskAndroid = "0.3.47"
voskAndroidVersion = "0.3.47"


[libraries]
# AndroidX Core
#noinspection Aligned16KB
alphacephei-vosk-android = { module = "com.alphacephei:vosk-android", version.ref = "voskAndroidVersion" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycleRuntimeKtx" }

# JUnit для тестів
androidx-drawerlayout = { module = "androidx.drawerlayout:drawerlayout", version.ref = "drawerlayout" }
androidx-room-compiler-v250 = { module = "androidx.room:room-compiler", version.ref = "roomCompiler" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "roomVersion" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "roomVersion" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Lifecycle (залишаємо для загального використання)
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }

# Бібліотеки AndroidX та Material Design (для XML-розмітки)
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# Gson library
google-gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
material-v1120 = { module = "com.google.android.material:material", version.ref = "materialVersion" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "roomVersion" }
vosk-android = { module = "com.alphacephei.vosk:vosk-android", version.ref = "voskAndroid" }

[plugins]
# Плагіни для Android Gradle Plugin та Kotlin
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

